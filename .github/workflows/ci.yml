name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (worker)
        run: npx tsc --noEmit -p tsconfig.worker.json

      - name: Typecheck (web)
        run: npx tsc --noEmit -p tsconfig.web.json

      - name: Build web assets
        run: npx vite build
        env:
          NODE_ENV: production

      - name: Frontend lint (Svelte)
        run: npx svelte-check --tsconfig tsconfig.web.json 2>/dev/null || true

      - name: Run unit tests
        run: npx vitest run --silent 2>/dev/null || echo "no vitest configured"

  security:
    name: Dependency & secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high || true
        continue-on-error: true

      - name: Run gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true