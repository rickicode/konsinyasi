name: konsi_mobile
description: 'Aplikasi Android native untuk operasional lapangan Konsi — konsinyasi kopi susu botolan.'

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10
  google_fonts: ^6.2.1

  # State Management & Navigation
  flutter_riverpod: ^2.5.1
  riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.3

  # Networking
  dio: ^5.7.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1

  # Local Storage
  drift: ^2.19.1
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.24
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.4
  path: ^1.9.0

  # Location & Maps
  geolocator: ^13.0.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Camera & Image
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  image: ^4.2.0

  # Notifications
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # Connectivity & Device Info
  shared_preferences: ^2.2.3
  connectivity_plus: ^6.0.5
  workmanager: ^0.5.2
  share_plus: ^10.0.2
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.2

  # PDF / Printing
  pdf: ^3.11.0
  printing: ^5.13.1

  # Utils
  meta: ^1.12.0
  intl: ^0.19.0
  uuid: ^4.4.2
  equatable: ^2.0.5
  dart_mappable: ^4.2.2
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  drift_dev: ^2.19.1
  riverpod_generator: ^2.4.3
  riverpod_lint: ^2.3.13
  custom_lint: ^0.6.4
  json_serializable: ^6.8.0
  freezed: ^2.5.7
  dart_mappable_builder: ^4.2.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
