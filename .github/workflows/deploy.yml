name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'wrangler.toml'
      - 'migrations/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.ts'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, migrate & deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck worker
        run: npx tsc --noEmit -p tsconfig.worker.json

      - name: Typecheck web
        run: npx tsc --noEmit -p tsconfig.web.json

      - name: Build web assets
        run: npx vite build > /tmp/vite-build.log 2>&1

      - name: Fail on Svelte warnings / errors
        run: |
          if grep -qE "warning|deprecated|implicitly|must have" /tmp/vite-build.log; then
            echo "::error::Build produced Svelte warnings:"
            grep -E "warning|deprecated|implicitly|must have" /tmp/vite-build.log | head -40
            exit 1
          fi
          echo "Build clean (no warnings)"

      - name: Deploy worker (assets + API)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env production

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply konsi --remote
