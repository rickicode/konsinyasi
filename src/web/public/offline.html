<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Konsi — Offline</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f7f3eb;color:#3e2723;text-align:center;padding:1.5rem}
    .card{max-width:24rem}
    h1{font-size:1.5rem;font-weight:700;margin-bottom:.5rem}
    p{color:#795548;margin-bottom:1.5rem;line-height:1.6}
    button{background:#5d4037;color:#fff;border:none;padding:.75rem 1.5rem;border-radius:.5rem;font-weight:600;cursor:pointer;font-size:.9rem}
    button:hover{background:#4e342e}
  </style>
</head>
<body>
  <div class="card">
    <h1>📡 Kamu sedang offline</h1>
    <p>Koneksi internet tidak tersedia. Beberapa fitur mungkin terbatas. Coba lagi setelah koneksi pulih.</p>
    <button onclick="location.reload()">Coba Lagi</button>
  </div>
</body>
</html>
