name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (worker)
        run: npx tsc --noEmit -p tsconfig.worker.json

      - name: Typecheck (web)
        run: npx tsc --noEmit -p tsconfig.web.json

      - name: Build web assets
        run: npx vite build > /tmp/vite-build.log 2>&1
        env:
          NODE_ENV: production

      - name: Fail on Svelte warnings / errors
        run: |
          if grep -qE "warning|deprecated|implicitly|must have" /tmp/vite-build.log; then
            echo "::error::Build produced Svelte warnings:"
            grep -E "warning|deprecated|implicitly|must have" /tmp/vite-build.log | head -40
            exit 1
          fi
          echo "Build clean (no warnings)"

      - name: Run unit tests
        run: npx vitest run

  security:
    name: Dependency & secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm audit
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Run gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
